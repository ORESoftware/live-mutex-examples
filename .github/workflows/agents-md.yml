name: agents.md contract

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate hierarchical repository instructions
        uses: ORESoftware/ai-agent-coordinator.rs/.github/actions/validate-agents-md@06f0bdb632ef129cce3f64d4fc98e16261532892
        with:
          repo-root: ${{ github.workspace }}
          start-dir: ${{ github.workspace }}/src
